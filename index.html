<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nako</title>
<meta name="description" content="Nako is a personal agent that lives on your own machine. She remembers what you tell her, writes down what she learns, and answers wherever you chat.">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.png" type="image/png">
<meta property="og:title" content="Nako">
<meta property="og:description" content="A personal agent that lives on your own machine.">
<meta property="og:image" content="https://nakode.moe/icon-512.png">
<meta property="og:url" content="https://nakode.moe/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="idle.webp"><link rel="preload" as="image" href="thinking.webp"><link rel="preload" as="image" href="replying.webp">
<style>
  :root {
    --bg: #09090b; --card: #111114; --fill: #18181c; --ink: #ececef; --muted: #8e8e99;
    --line: rgb(255 255 255 / 8%); --pink: #ec4899; --pink-deep: #db2777;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "M PLUS Rounded 1c", system-ui, sans-serif; font-weight: 500; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .mark { font: 900 24px "Noto Sans JP", sans-serif; letter-spacing: .02em; }
  .mark b { color: var(--pink); font-weight: 900; }
  .links { display: flex; gap: 22px; color: var(--muted); font-size: 15px; }
  .links a:hover { color: var(--ink); }

  .page { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 26px 20px 22px; }
  .page > * { width: 100%; max-width: 680px; }
  header { display: flex; justify-content: space-between; align-items: center; }

  .thread { margin: auto 0; padding: 30px 0 26px; display: flex; flex-direction: column; gap: 18px; }
  .you { align-self: flex-end; background: var(--pink-deep); color: #fff; border-radius: 22px 22px 6px 22px; padding: 11px 18px; font-size: 18px; }
  .her { display: grid; grid-template-columns: 112px minmax(0, 1fr); column-gap: 14px; }
  .her .face { width: 112px; height: 112px; align-self: start; position: relative; margin-top: -14px; }
  .her .face img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .her .face img.on { opacity: 1; }
  .msgs { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
  .msgs > * { max-width: 100%; }
  .bub { background: var(--fill); border-radius: 22px; padding: 12px 18px; font-size: 18px; position: relative; }
  .bub.big { font-size: 34px; font-weight: 800; letter-spacing: -.01em; padding: 12px 22px; }
  .bub .w { color: transparent; }
  .bub .w.on { color: inherit; }
  .dots { position: absolute; left: 22px; top: 50%; display: flex; gap: 7px; transform: translateY(-50%); }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); animation: bob 1.1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 60%, 100% { transform: none; opacity: .45; } 30% { transform: translateY(-5px); opacity: 1; } }
  .cmd { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); border-radius: 22px; padding: 13px 14px 13px 18px; font: 500 14px "JetBrains Mono", ui-monospace, monospace; }
  .cmd code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .cmd code i { color: var(--muted); font-style: normal; }
  .pill { font: 700 13px "M PLUS Rounded 1c", sans-serif; color: var(--ink); background: var(--fill); border: 0; border-radius: 999px; height: 30px; padding: 0 14px; cursor: pointer; flex: none; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .btn { display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 16px; }
  .btn.go { background: var(--pink-deep); color: #fff; }
  .btn.quiet { box-shadow: inset 0 0 0 1px var(--line); background: var(--card); }
  .hide { visibility: hidden; }

  .composer { display: flex; align-items: center; gap: 10px; height: 54px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; padding: 0 8px 0 22px; font-size: 17px; }
  .composer .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
  .composer .text.ghost { color: var(--muted); }
  .caret { display: inline-block; width: 2px; height: 1.15em; background: var(--pink); vertical-align: -0.2em; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--fill); color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; }
  .send.ready { background: var(--pink-deep); color: #fff; }
  .send svg { width: 18px; height: 18px; }
  footer { color: var(--muted); font-size: 14px; text-align: center; margin-top: 16px; }

  @media (max-width: 820px) {
    .page { padding: 20px 16px 16px; }
    .thread { padding: 22px 0 20px; gap: 14px; }
    .you { font-size: 16.5px; }
    .her { grid-template-columns: 64px minmax(0, 1fr); column-gap: 8px; }
    .her .face { width: 64px; height: 64px; margin-top: -6px; }
    .bub { font-size: 16.5px; padding: 11px 15px; }
    .bub.big { font-size: 28px; padding: 10px 18px; }
    .dots { left: 18px; }
    .cmd { font-size: 12.5px; padding-left: 14px; }
    .links { gap: 16px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="mark"><b>な</b>こ</div>
    <nav class="links"><a href="https://github.com/QuillDev/Nako-Agent">GitHub</a></nav>
  </header>

  <div class="thread">
    <div class="you hide" id="you">who are you?</div>
    <div class="her">
      <div class="face">
        <img id="f-idle" src="idle.webp" alt="Nako" class="on">
        <img id="f-thinking" src="thinking.webp" alt="">
        <img id="f-replying" src="replying.webp" alt="">
      </div>
      <div class="msgs">
        <div class="bub big hide" data-say="hi, i'm nako."><span class="dots" id="dots"><i></i><i></i><i></i></span></div>
        <div class="bub hide" data-say="i'm an agent that lives on your own machine."></div>
        <div class="bub hide" data-say="i remember what you tell me, write down what i learn, and answer wherever you chat."></div>
        <div class="bub hide" data-say="want one of me? run this:"></div>
        <div class="cmd hide" id="cmd"><code><i>$</i> curl -fsSL https://nakode.moe/install.sh | bash</code><button class="pill" id="copy">Copy</button></div>
        <div class="chips hide" id="chips"><a class="btn go" href="https://github.com/QuillDev/Nako-Agent">Show me the code</a></div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="text" id="typed"></div>
    <button class="send" id="send" aria-label="Ask again">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
  <footer>A fork of <a href="https://github.com/NousResearch/hermes-agent" style="text-decoration:underline">Hermes Agent</a>, kept current with upstream. MIT.</footer>
</div>

<script>
(() => {
  const ASK = "who are you?";
  const $ = (id) => document.getElementById(id);
  const bubs = [...document.querySelectorAll(".bub")];
  // Every word is laid out from the first frame and only its colour changes, so nothing moves as she "types".
  for (const bub of bubs) {
    for (const word of bub.dataset.say.split(" ")) {
      const span = document.createElement("span");
      span.className = "w"; span.textContent = word + " ";
      bub.append(span);
    }
  }
  // One timeline, in ms. Each bubble: when it starts and how long each word takes.
  const TYPE_AT = 700, KEY = 95, SENT_AT = TYPE_AT + ASK.length * KEY + 450;
  const THINK_AT = SENT_AT + 350, REPLY_AT = THINK_AT + 2100;
  const WORD = 85, GAP = 380;
  const starts = []; let at = REPLY_AT;
  for (const bub of bubs) { starts.push(at); at += bub.children.length * WORD + GAP; }
  const CMD_AT = at - GAP + 150, CHIPS_AT = CMD_AT + 450, END = CHIPS_AT + 900;

  function render(t) {
    const typedCount = Math.max(0, Math.min(ASK.length, Math.floor((t - TYPE_AT) / KEY)));
    const sent = t >= SENT_AT;
    const done = t >= END;
    $("typed").className = "text" + (done ? " ghost" : "");
    $("typed").innerHTML = done ? "ask her again" : sent ? "" : ASK.slice(0, typedCount).replace(/ /g, "&nbsp;") + '<span class="caret"></span>';
    $("send").classList.toggle("ready", (!sent && typedCount === ASK.length) || done);
    $("you").classList.toggle("hide", !sent);

    const face = t < THINK_AT ? "idle" : t < REPLY_AT ? "thinking" : done ? "idle" : "replying";
    for (const name of ["idle", "thinking", "replying"]) $("f-" + name).classList.toggle("on", name === face);
    $("dots").style.display = t >= THINK_AT && t < REPLY_AT ? "" : "none";

    bubs.forEach((bub, i) => {
      const shown = i === 0 ? t >= THINK_AT : t >= starts[i];
      bub.classList.toggle("hide", !shown);
      const words = Math.floor((t - starts[i]) / WORD) + 1;
      [...bub.querySelectorAll(".w")].forEach((w, n) => w.classList.toggle("on", n < words));
    });
    $("cmd").classList.toggle("hide", t < CMD_AT);
    $("chips").classList.toggle("hide", t < CHIPS_AT);
  }

  const frozen = new URLSearchParams(location.search).get("t");
  if (frozen !== null) { render(frozen === "end" ? END : Number(frozen)); return; }
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { render(END); return; }

  let began = 0, raf = 0;
  function play() {
    cancelAnimationFrame(raf);
    began = performance.now();
    const tick = (now) => { const t = now - began; render(t); if (t < END) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  }
  $("send").addEventListener("click", play);
  $("copy").addEventListener("click", () => {
    navigator.clipboard?.writeText("curl -fsSL https://nakode.moe/install.sh | bash");
    $("copy").textContent = "Copied";
  });
  render(0);
  play();
})();
</script>
</body>
</html>
